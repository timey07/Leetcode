name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"

jobs:
  build:
    runs-on: ubuntu-latest
    # Explicitly grant write permissions so the bot can push code
    permissions:
      contents: write 

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Sync
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: my-folder
          verbose: true
          commit-header: "[LeetCode Sync]"

      - name: Pull newly synced files
        run: |
          # Pull the commit made by leetcode-sync so organize.py has the latest files
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main

      - name: Organize by Topics
        run: python scripts/organize.py

      - name: Commit Topic Updates
        run: |
          git add Topics
          
          # Safely check if there are changes. If yes, commit and push. If no, skip gracefully.
          if git diff --cached --quiet; then
            echo "No topic updates to commit."
          else
            git commit -m "[Topics] Update"
            git push origin main
          fi